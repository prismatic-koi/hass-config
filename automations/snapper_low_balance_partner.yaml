- id: snapper_low_balance_partner
  alias: Snapper Low Balance - Partner
  description: 'Notify Partner when the Snapper Partner card balance drops below the threshold.'
  trigger:
  - platform: numeric_state
    entity_id: sensor.snapper_partner_balance
    below: 5
  condition:
  - condition: state
    entity_id: input_boolean.snapper_notify_partner
    state: 'on'
  action:
  - service: notify.notify
    data:
      title: "Snapper Low Balance"
      message: "Partner Snapper card balance is below $5."
