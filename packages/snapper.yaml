# Snapper

input_datetime:
  snapper_ben_work_outage_start:
    name: "Snapper Ben Work Outage Start"
    has_date: true
    has_time: true
  snapper_ben_personal_outage_start:
    name: "Snapper Ben Personal Outage Start"
    has_date: true
    has_time: true
  snapper_ness_outage_start:
    name: "Snapper Ness Outage Start"
    has_date: true
    has_time: true

input_boolean:
  snapper_notify_ben_work:
    name: "Snapper Ben Work Low Balance Notify"
    icon: mdi:bell-ring
  snapper_notify_ben_personal:
    name: "Snapper Ben Personal Low Balance Notify"
    icon: mdi:bell-ring
  snapper_notify_ness:
    name: "Snapper Ness Low Balance Notify"
    icon: mdi:bell-ring
  snapper_ben_work_outage_alerted:
    name: "Snapper Ben Work Outage Alerted Latch"
    icon: mdi:alert-circle-outline
  snapper_ben_personal_outage_alerted:
    name: "Snapper Ben Personal Outage Alerted Latch"
    icon: mdi:alert-circle-outline
  snapper_ness_outage_alerted:
    name: "Snapper Ness Outage Alerted Latch"
    icon: mdi:alert-circle-outline

# Snapper card balances via catchy.nz (unofficial free third-party aggregator).
# catchy.nz is not an official Snapper API and can stop working without
# notice. The low-balance automations are not hardened against it, but the
# "Snapper Balance Check Failure" automation below alerts Ben when a card has
# had no numeric balance for 48 hours.
#
# YAML's !secret tag can only replace a whole scalar value, not part of a
# string. So the full JSON body for each card
# ({"cardNumber":"<CARD_NUMBER>","cvv":"<CVV>"}) lives in secrets.yaml under
# the *_payload key. No card number or CVV is ever written to a tracked file.
#
# state_class: total — per HA's sensor entity docs, device_class: monetary
# forbids state_class: measurement, and total fits a balance that rises on
# top-up and falls on tag-off.
#
# availability: marks the entity unavailable when currentBalanceCents is absent
# from the response, avoiding the ValueError that occurs when value_template
# returns a non-numeric string to a sensor with device_class: monetary.
# value_template: arithmetic only — divides cents by 100 and rounds to 2 places.
rest:
  - resource: https://catchy.nz/api/snapper
    method: POST
    headers:
      Content-Type: application/json
      Origin: https://catchy.nz
    payload: !secret snapper_ben_work_payload
    scan_interval: 21600
    sensor:
      - name: "Snapper Ben Work Balance"
        unique_id: snapper_ben_work_balance
        unit_of_measurement: NZD
        device_class: monetary
        state_class: total
        availability: "{{ value_json is defined and value_json.currentBalanceCents is defined }}"
        value_template: "{{ (value_json.currentBalanceCents / 100) | round(2) }}"
  - resource: https://catchy.nz/api/snapper
    method: POST
    headers:
      Content-Type: application/json
      Origin: https://catchy.nz
    payload: !secret snapper_ben_personal_payload
    scan_interval: 21600
    sensor:
      - name: "Snapper Ben Personal Balance"
        unique_id: snapper_ben_personal_balance
        unit_of_measurement: NZD
        device_class: monetary
        state_class: total
        availability: "{{ value_json is defined and value_json.currentBalanceCents is defined }}"
        value_template: "{{ (value_json.currentBalanceCents / 100) | round(2) }}"
  - resource: https://catchy.nz/api/snapper
    method: POST
    headers:
      Content-Type: application/json
      Origin: https://catchy.nz
    payload: !secret snapper_ness_payload
    scan_interval: 21600
    sensor:
      - name: "Snapper Ness Balance"
        unique_id: snapper_ness_balance
        unit_of_measurement: NZD
        device_class: monetary
        state_class: total
        availability: "{{ value_json is defined and value_json.currentBalanceCents is defined }}"
        value_template: "{{ (value_json.currentBalanceCents / 100) | round(2) }}"

automation:

  # No user switch: always on. The outage start lives in an input_datetime,
  # which restores on restart, so a restart cannot reset the 48 hour clock
  # the way a trigger `for:` timer would. The hourly pattern re-checks the
  # persisted start, so the alert is late by at most 1 hour. A start epoch
  # (year 1970) means "no outage". The failure signal is a non-numeric state,
  # not an unchanged state: a REST sensor with the same balance fires nothing.
  - id: snapper_balance_check_failure
    alias: Snapper Balance Check Failure
    description: 'Notify Ben when a Snapper balance sensor has been non-numeric for 48 hours.'
    mode: queued
    trigger:
    - platform: time_pattern
      minutes: 0
    - platform: homeassistant
      event: start
    - platform: state
      entity_id:
      - sensor.snapper_ben_work_balance
      - sensor.snapper_ben_personal_balance
      - sensor.snapper_ness_balance
    action:
    - repeat:
        for_each:
        - sensor: sensor.snapper_ben_work_balance
          start: input_datetime.snapper_ben_work_outage_start
          latch: input_boolean.snapper_ben_work_outage_alerted
          name: Ben Work
        - sensor: sensor.snapper_ben_personal_balance
          start: input_datetime.snapper_ben_personal_outage_start
          latch: input_boolean.snapper_ben_personal_outage_alerted
          name: Ben Personal
        - sensor: sensor.snapper_ness_balance
          start: input_datetime.snapper_ness_outage_start
          latch: input_boolean.snapper_ness_outage_alerted
          name: Ness
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ states(repeat.item.sensor) is is_number }}"
            sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: "{{ repeat.item.start }}"
              data:
                timestamp: 0
            - action: input_boolean.turn_off
              target:
                entity_id: "{{ repeat.item.latch }}"
          default:
          - if:
            - condition: template
              value_template: "{{ (state_attr(repeat.item.start, 'timestamp') | float(0)) < 100000000 }}"
            then:
            - action: input_datetime.set_datetime
              target:
                entity_id: "{{ repeat.item.start }}"
              data:
                timestamp: "{{ now().timestamp() }}"
            else:
            - if:
              - condition: template
                value_template: >-
                  {{ now().timestamp() - (state_attr(repeat.item.start, 'timestamp') | float(0)) >= 172800 }}
              - condition: template
                value_template: "{{ is_state(repeat.item.latch, 'off') }}"
              then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ repeat.item.latch }}"
              - action: notify.send_message
                target:
                  entity_id: notify.ben_s25
                data:
                  title: "Snapper Balance Check Failure"
                  message: "{{ repeat.item.name }} Snapper card has had no balance reading for 48 hours. catchy.nz may have changed its API."
  - id: snapper_low_balance_ben_work
    alias: Snapper Low Balance - Ben Work
    description: 'Notify Ben when the Snapper Ben Work card balance drops below the threshold.'
    variables:
      threshold: 10
    # A single state trigger, not numeric_state: numeric_state does not fire
    # when the previous state was non-numeric, so a sensor returning from
    # unavailable straight to a below-threshold value would raise no alert.
    # These REST sensors go unavailable on every catchy.nz hiccup, so that
    # gap matters here. The condition below does the actual crossing check.
    trigger:
    - platform: state
      entity_id: sensor.snapper_ben_work_balance
    condition:
    - condition: state
      entity_id: input_boolean.snapper_notify_ben_work
      state: 'on'
    # Fire only on a genuine downward crossing: the new state is numeric and
    # below threshold, and the old state was NOT already below threshold
    # (i.e. old state is non-numeric/unavailable/unknown, or numeric and
    # >= threshold). HA's `is_number` test (not Jinja's built-in `number`
    # test, which is False for state strings like "9.93") and Jinja's
    # short-circuiting `and`/`or` keep this from raising when either
    # side is non-numeric — a template crash here is exactly the
    # class of bug this automation exists to fix.
    # A balance that stays below threshold for a week produces exactly one
    # notification: the first drop, not every later state update.
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and trigger.to_state.state is is_number
           and (trigger.to_state.state | float) < threshold
           and not (trigger.from_state is not none and trigger.from_state.state is is_number
                    and (trigger.from_state.state | float) < threshold) }}
    action:
    - action: notify.send_message
      target:
        entity_id: notify.ben_s25
      data:
        title: "Snapper Low Balance"
        # message templates the threshold off the `threshold` variable above,
        # so it renders identically no matter which state update triggered
        # the crossing, and never depends on trigger.below (which is absent
        # on a manual run).
        message: "Ben Work Snapper card balance is below ${{ threshold }}."

  - id: snapper_low_balance_ben_personal
    alias: Snapper Low Balance - Ben Personal
    description: 'Notify Ben when the Snapper Ben Personal card balance drops below the threshold.'
