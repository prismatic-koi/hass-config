        {{ trigger.to_state is not none and trigger.to_state.state is is_number
           and (trigger.to_state.state | float) < threshold
           and not (trigger.from_state is not none and trigger.from_state.state is is_number
                    and (trigger.from_state.state | float) < threshold) }}
    action:
    - action: notify.send_message
      target:
        entity_id: notify.vanessas_iphone
      data:
        title: "Snapper Low Balance"
        # message templates the threshold off the `threshold` variable above,
        # so it renders identically no matter which state update triggered
