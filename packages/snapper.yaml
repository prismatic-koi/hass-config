# Snapper

input_boolean:
  snapper_notify_ben_work:
    name: "Snapper Ben Work Low Balance Notify"
    icon: mdi:bell-ring
  snapper_notify_ben_personal:
    name: "Snapper Ben Personal Low Balance Notify"
    icon: mdi:bell-ring
  snapper_notify_ness:
    name: "Snapper Ness Low Balance Notify"
    icon: mdi:bell-ring

# Snapper card balances via catchy.nz (unofficial free third-party aggregator).
# catchy.nz is not an official Snapper API and can stop working without
# notice. This risk is accepted; do not harden against it.
#
# YAML's !secret tag can only replace a whole scalar value, not part of a
# string. So each card's full POST URL (https://catchy.nz/api/snapper/<CARD_NUMBER>)
# lives in secrets.yaml under the *_resource key, and each full JSON payload
# ({"cvv":"<CVV>"}) lives under the *_payload key. No card number or CVV is ever
# written to a tracked file.
#
# state_class: total — per HA's sensor entity docs, device_class: monetary
# forbids state_class: measurement, and total fits a balance that rises on
# top-up and falls on tag-off.
#
# availability: marks the entity unavailable when currentBalanceCents is absent
# from the response, avoiding the ValueError that occurs when value_template
# returns a non-numeric string to a sensor with device_class: monetary.
# value_template: arithmetic only — divides cents by 100 and rounds to 2 places.
rest:
  - resource: !secret snapper_ben_work_resource
    method: POST
    headers:
      Content-Type: text/plain;charset=UTF-8
      Origin: https://catchy.nz
    payload: !secret snapper_ben_work_payload
    scan_interval: 21600
    sensor:
      - name: "Snapper Ben Work Balance"
        unique_id: snapper_ben_work_balance
        unit_of_measurement: NZD
        device_class: monetary
        state_class: total
        availability: "{{ value_json is defined and value_json.currentBalanceCents is defined }}"
        value_template: "{{ (value_json.currentBalanceCents / 100) | round(2) }}"
  - resource: !secret snapper_ben_personal_resource
    method: POST
    headers:
      Content-Type: text/plain;charset=UTF-8
      Origin: https://catchy.nz
    payload: !secret snapper_ben_personal_payload
    scan_interval: 21600
    sensor:
      - name: "Snapper Ben Personal Balance"
        unique_id: snapper_ben_personal_balance
        unit_of_measurement: NZD
        device_class: monetary
        state_class: total
        availability: "{{ value_json is defined and value_json.currentBalanceCents is defined }}"
        value_template: "{{ (value_json.currentBalanceCents / 100) | round(2) }}"
  - resource: !secret snapper_ness_resource
    method: POST
    headers:
      Content-Type: text/plain;charset=UTF-8
      Origin: https://catchy.nz
    payload: !secret snapper_ness_payload
    scan_interval: 21600
    sensor:
      - name: "Snapper Ness Balance"
        unique_id: snapper_ness_balance
        unit_of_measurement: NZD
        device_class: monetary
        state_class: total
        availability: "{{ value_json is defined and value_json.currentBalanceCents is defined }}"
        value_template: "{{ (value_json.currentBalanceCents / 100) | round(2) }}"

automation:
  - id: snapper_low_balance_ben_work
    alias: Snapper Low Balance - Ben Work
    description: 'Notify Ben when the Snapper Ben Work card balance drops below the threshold.'
    variables:
      threshold: 10
    # A single state trigger, not numeric_state: numeric_state does not fire
    # when the previous state was non-numeric, so a sensor returning from
    # unavailable straight to a below-threshold value would raise no alert.
    # These REST sensors go unavailable on every catchy.nz hiccup, so that
    # gap matters here. The condition below does the actual crossing check.
    trigger:
    - platform: state
      entity_id: sensor.snapper_ben_work_balance
    condition:
    - condition: state
      entity_id: input_boolean.snapper_notify_ben_work
      state: 'on'
    # Fire only on a genuine downward crossing: the new state is numeric and
    # below threshold, and the old state was NOT already below threshold
    # (i.e. old state is non-numeric/unavailable/unknown, or numeric and
    # >= threshold). `is number` and Jinja's short-circuiting `and`/`or`
    # keep this from raising when either side is non-numeric — a template
    # crash here is exactly the class of bug this automation exists to fix.
    # A balance that stays below threshold for a week produces exactly one
    # notification: the first drop, not every later state update.
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and trigger.to_state.state is number
           and (trigger.to_state.state | float) < threshold
           and not (trigger.from_state is not none and trigger.from_state.state is number
                    and (trigger.from_state.state | float) < threshold) }}
    action:
    - action: notify.send_message
      target:
        entity_id: notify.ben_s25
      data:
        title: "Snapper Low Balance"
        # message templates the threshold off the `threshold` variable above,
        # so it renders identically whether triggered by the crossing or the
        # daily re-check, and never depends on trigger.below (which is
        # absent on a manual run).
        message: "Ben Work Snapper card balance is below ${{ threshold }}."

