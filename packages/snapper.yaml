    # >= threshold). HA's `is_number` test (not Jinja's built-in `number`
    # test, which is False for state strings like "9.93") and Jinja's
    # short-circuiting `and`/`or` keep this from raising when either
    # side is non-numeric — a template crash here is exactly the
    # class of bug this automation exists to fix.
    # A balance that stays below threshold for a week produces exactly one
    # notification: the first drop, not every later state update.
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and trigger.to_state.state is is_number
           and (trigger.to_state.state | float) < threshold
           and not (trigger.from_state is not none and trigger.from_state.state is is_number
                    and (trigger.from_state.state | float) < threshold) }}
    action:
    - action: notify.send_message
      target:
        entity_id: notify.ben_s25
      data:
        title: "Snapper Low Balance"
        # message templates the threshold off the `threshold` variable above,
        # so it renders identically no matter which state update triggered
        # the crossing, and never depends on trigger.below (which is absent
        # on a manual run).
        message: "Ben Personal Snapper card balance is below ${{ threshold }}."

  - id: snapper_low_balance_ness
    alias: Snapper Low Balance - Ness
    description: 'Notify Ness when the Snapper Ness card balance drops below the threshold.'
    variables:
      threshold: 10
    # A single state trigger, not numeric_state: numeric_state does not fire
