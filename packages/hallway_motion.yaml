# Hallway Motion

input_number:
  hallway_motion_timeout:
    name: 'Stay on time'
    min: 1
    max: 30
    step: 1
    initial: 5
    mode: box
    icon: mdi:timer-outline
    unit_of_measurement: min

automation:
  - id: id_hallway_motion_near
    alias: Hallway Motion Light Near
    description: Turn on ambient lights after sunset on motion detect
    trigger:
    - platform: state
      entity_id: binary_sensor.hall_sensor_near_occupancy
      from: 'off'
      to: 'on'
    condition:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    - condition: state
      entity_id: input_boolean.ambient_lights_active # Use the helper to check if lights should be off
      state: 'off'
    action:
    - service: light.turn_on
      target:
        entity_id: '{{ lights }}'
      data:
        brightness_pct: 75
        transition: 2
    - service: light.turn_on
      target:
        entity_id: '{{ brightlights }}'
      data:
        brightness_pct: 20
        transition: 2
    - repeat:
        sequence:
        - delay: '00:00:05'
        - variables:
            lights_wrong: >
              {{ lights | reject('is_state', 'on') | list }}
            brightlights_wrong: >
              {{ brightlights | reject('is_state', 'on') | list }}
        - if:
          - condition: template
            value_template: '{{ lights_wrong | length > 0 }}'
          then:
          - service: light.turn_on
            target:
              entity_id: '{{ lights_wrong }}'
            data:
              brightness_pct: 75
              transition: 2
        - if:
          - condition: template
            value_template: '{{ brightlights_wrong | length > 0 }}'
          then:
          - service: light.turn_on
            target:
              entity_id: '{{ brightlights_wrong }}'
            data:
              brightness_pct: 20
              transition: 2
        until:
        - condition: template
          value_template: >
            {{ repeat.index >= 3 or
               (lights + brightlights) | reject('is_state', 'on') | list | length == 0 }}
    - service: input_boolean.turn_on # Set helper to ON when this automation turns lights on
      target:
        entity_id: input_boolean.ambient_lights_active
    - wait_for_trigger:
        platform: state
        entity_id: binary_sensor.hall_sensor_near_occupancy
        from: 'on'
        to: 'off'
    - delay: '{{ states(''input_number.hallway_motion_timeout'') | int(0) * 60 }}'
    - service: light.turn_off
      target:
        entity_id: '{{ lights }}'
    - service: light.turn_off
      target:
        entity_id: '{{ brightlights }}'
    - repeat:
        sequence:
        - delay: '00:00:05'
        - variables:
            lights_on: >
              {{ (lights + brightlights) | select('is_state', 'on') | list }}
        - if:
          - condition: template
            value_template: '{{ lights_on | length > 0 }}'
          then:
          - service: light.turn_off
            target:
              entity_id: '{{ lights_on }}'
        until:
        - condition: template
          value_template: >
            {{ repeat.index >= 3 or
               (lights + brightlights) | select('is_state', 'on') | list | length == 0 }}
    - service: input_boolean.turn_off # Set helper to OFF when this automation turns lights off
      target:
        entity_id: input_boolean.ambient_lights_active
    variables:
      lights:
      - light.kitchen_lightstrip
      - light.tv_backlight
      - light.plant_backlight
      - light.desk_lightstrip
      brightlights:
      - light.hall_lightstrip

