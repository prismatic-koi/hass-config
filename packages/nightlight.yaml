# Nightlight

input_datetime:
  nightlight_on:
    name: "Nightlight on time"
    has_date: false
    has_time: true
    icon: mdi:alarm
  nightlight_off:
    name: "Nightlight off time"
    has_date: false
    has_time: true
    icon: mdi:alarm

automation:
  - id: id_nightlight_on
    alias: Nightlight on
    description: Turn on nightlight at preset time
    trigger:
    - platform: time
      at: input_datetime.nightlight_on
    variables:
      entities:
      - light.nightlight
    action:
    - service: light.turn_on
      target:
        entity_id: '{{ entities }}'
      data:
        brightness_pct: 75
        transition: 60
    - repeat:
        sequence:
        - delay: '00:00:05'
        - variables:
            wrong: >
              {{ entities | reject('is_state', 'on') | list }}
        - if:
          - condition: template
            value_template: '{{ wrong | length > 0 }}'
          then:
          - service: light.turn_on
            target:
              entity_id: '{{ wrong }}'
            data:
              brightness_pct: 75
              transition: 60
        until:
        - condition: template
          value_template: >
            {{ repeat.index >= 3 or
               entities | reject('is_state', 'on') | list | length == 0 }}

  - id: id_nightlight_off
    alias: Nightlight off
    description: Turn off nightlight at preset time
    trigger:
    - platform: time
      at: input_datetime.nightlight_off
    variables:
      entities:
      - light.nightlight
    action:
    - service: light.turn_off
      target:
        entity_id: '{{ entities }}'
    - repeat:
        sequence:
        - delay: '00:00:05'
        - variables:
            wrong: >
              {{ entities | select('is_state', 'on') | list }}
        - if:
          - condition: template
            value_template: '{{ wrong | length > 0 }}'
          then:
          - service: light.turn_off
            target:
              entity_id: '{{ wrong }}'
        until:
        - condition: template
          value_template: >
            {{ repeat.index >= 3 or
               entities | select('is_state', 'on') | list | length == 0 }}
