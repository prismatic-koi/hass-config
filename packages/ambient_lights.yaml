# Ambient Lights

input_boolean:
  ambient_lights_active:
    name: "Ambient Lights Active"
    icon: mdi:light-auto-outline

input_datetime:
  ambient_lights_off:
    name: "Lights off time"
    has_date: false
    has_time: true
    icon: mdi:alarm

automation:
  - id: id_ambient_lights_on
    alias: Ambient Lights on
    description: Turn on ambient lights at sunset
    trigger:
      - platform: sun
        event: sunset
        offset: 0
    action:
      - service: light.turn_on
        target:
          entity_id: "{{ lights }}"
        data:
          brightness_pct: 75
          transition: 60
          color_temp_kelvin: 2762
      - service: light.turn_on
        target:
          entity_id: "{{ brightlights }}"
        data:
          brightness_pct: 20
          transition: 2
      - service: switch.turn_on
        target:
          entity_id: "{{ switches }}"
      - service: input_boolean.turn_on # Set helper to ON when this automation turns lights on
        target:
          entity_id: input_boolean.ambient_lights_active
      - repeat:
          sequence:
            - delay: "00:00:05"
            - variables:
                lights_wrong: >
                  {{ lights | reject('is_state', 'on') | list }}
                brightlights_wrong: >
                  {{ brightlights | reject('is_state', 'on') | list }}
                switches_wrong: >
                  {{ switches | reject('is_state', 'on') | list }}
            - if:
                - condition: template
                  value_template: "{{ lights_wrong | length > 0 }}"
              then:
                - service: light.turn_on
                  target:
                    entity_id: "{{ lights_wrong }}"
                  data:
                    brightness_pct: 75
                    transition: 60
                    color_temp_kelvin: 2762
            - if:
                - condition: template
                  value_template: "{{ brightlights_wrong | length > 0 }}"
              then:
                - service: light.turn_on
                  target:
                    entity_id: "{{ brightlights_wrong }}"
                  data:
                    brightness_pct: 20
                    transition: 2
            - if:
                - condition: template
                  value_template: "{{ switches_wrong | length > 0 }}"
              then:
                - service: switch.turn_on
                  target:
                    entity_id: "{{ switches_wrong }}"
          until:
            - condition: template
              value_template: >
                {{ repeat.index >= 3 or
                   (lights + brightlights + switches)
                   | reject('is_state', 'on') | list | length == 0 }}
    variables:
      lights:
        - light.kitchen_lightstrip
        - light.tv_backlight
        - light.plant_backlight
        - light.desk_lightstrip
      brightlights:
        - light.hall_lightstrip
      switches:
        - switch.lounge_big_lamp
        - switch.lounge_small_lamp
        - switch.office_desk_lamp

  - id: id_ambient_lights_off
    alias: Ambient Lights off
    description: Turn off ambient lights at preset time
    trigger:
      - platform: time
        at: input_datetime.ambient_lights_off
    action:
      - service: light.turn_off
        target:
          entity_id: "{{ lights + brightlights }}"
      - service: switch.turn_off
        target:
          entity_id: "{{ switches }}"
      - repeat:
          sequence:
            - delay: "00:00:05"
            - variables:
                lights_on: >
                  {{ (lights + brightlights) | select('is_state', 'on') | list }}
                switches_on: >
                  {{ switches | select('is_state', 'on') | list }}
            - if:
                - condition: template
                  value_template: "{{ lights_on | length > 0 }}"
              then:
                - service: light.turn_off
                  target:
                    entity_id: "{{ lights_on }}"
            - if:
                - condition: template
                  value_template: "{{ switches_on | length > 0 }}"
              then:
                - service: switch.turn_off
                  target:
                    entity_id: "{{ switches_on }}"
          until:
            - condition: template
              value_template: >
                {{ repeat.index >= 3 or
                   (lights + brightlights + switches)
                   | select('is_state', 'on') | list | length == 0 }}
      - service: input_boolean.turn_off # Set helper to OFF when this automation turns lights off
        target:
          entity_id: input_boolean.ambient_lights_active
    variables:
      lights:
        - light.kitchen_lightstrip
        - light.tv_backlight
        - light.plant_backlight
        - light.desk_lightstrip
      brightlights:
        - light.hall_lightstrip
      switches:
        - switch.lounge_big_lamp
        - switch.lounge_small_lamp
        - switch.office_desk_lamp

