# Loads default set of integrations. Do not remove.
default_config:

# Text to speech
tts:
  - platform: google_translate

# Automations created in the ui
automation ui: !include automations.yaml
# automations folder
automation manual: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

# Inputs
input_boolean: !include inputs/input_booleans.yaml
input_datetime: !include inputs/input_datetimes.yaml
#input_select: !include inputs/input_selects.yaml
input_number: !include inputs/input_numbers.yaml

# enable proxies
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.0.0.0/8

# enable api
api:

# Snapper card balances via catchy.nz (unofficial free third-party aggregator).
# catchy.nz is not an official Snapper API and can stop working without
# notice. This risk is accepted; do not harden against it.
#
# YAML's !secret tag can only replace a whole scalar value, not part of a
# string. So each card's full POST URL (https://catchy.nz/api/snapper/<card>)
# lives in secrets.yaml under the *_card key, and each full JSON payload
# ({"cvv":"<cvv>"}) lives under the *_cvv key. No card number or CVV is ever
# written to a tracked file.
rest:
  - resource: !secret snapper_ben_work_card
    method: POST
    headers:
      Content-Type: text/plain;charset=UTF-8
      Origin: https://catchy.nz
    payload: !secret snapper_ben_work_cvv
    scan_interval: 21600
    sensor:
      - name: "Snapper Ben Work Balance"
        unique_id: snapper_ben_work_balance
        unit_of_measurement: NZD
        device_class: monetary
        value_template: >-
          {% if value_json.currentBalanceCents is defined %}
            {{ value_json.currentBalanceCents / 100 }}
          {% else %}
            unavailable
          {% endif %}
        attributes:
          owner: "Ben"
